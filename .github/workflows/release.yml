# Tests on every push / pull request (Windows, macOS, Linux).
# Pushing a tag like v2.1.0 also builds all release files and publishes a GitHub Release:
#   git tag v2.1.0 && git push origin v2.1.0
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Test (Go vet + tests, TypeScript check + vitest)
        shell: bash
        run: |
          go version; node --version
          set -o pipefail
          if ! go run ./tools/build test 2>&1 | tee test.log; then
            # Show the end of the output on the run's summary page as well.
            msg=$(tail -n 60 test.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\r//g;s/\n/%0A/g')
            echo "::error title=Tests failed on ${{ matrix.os }}::${msg}"
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build release files (all OSes, CGO_ENABLED=0)
        run: go run ./tools/build release -skip-tests -version "${GITHUB_REF_NAME#v}"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/dashcam-studio-* dist/SHA256SUMS.txt \
            --title "Dashcam Studio ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
